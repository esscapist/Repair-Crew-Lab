<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация | Repair Crew Lab</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .register-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2c3b 0%, #1b4a5f 100%);
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        .register-card {
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: none;
            overflow: hidden;
        }
        .register-header {
            background: #0b2b3b;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .register-body {
            padding: 40px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }
        .back-link:hover {
            color: #FFB347;
        }
    </style>
</head>
<body>

<div class="register-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Карточка регистрации -->
                <div class="card register-card">
                    <div class="register-header">
                        <i class="fas fa-hard-hat fa-3x mb-3"></i>
                        <h2 class="mb-0">Repair Crew Lab</h2>
                        <p class="mb-0 mt-2">Создайте новый аккаунт</p>
                    </div>
                    <div class="register-body">
                        
                        <!-- Форма регистрации -->
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label">Полное имя</label>
                                <input type="text" class="form-control" id="regName" placeholder="Иван Строителев" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="regEmail" placeholder="student@repaircrew.ru" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="regPassword" placeholder="минимум 4 символа" required>
                            </div>
                            <div id="regError" class="text-danger small mb-3"></div>
                            <button type="submit" class="btn btn-success w-100 py-2">
                                <i class="fas fa-user-plus me-2"></i>Создать аккаунт
                            </button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-0">Уже есть аккаунт? 
                                <a href="login.html" class="text-warning">Войти</a>
                            </p>
                        </div>
                    </div>
                </div>
                
                <!-- Ссылка назад на главную -->
                <div class="text-center mt-4">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left me-2"></i>Вернуться на главную
                    </a>
                </div>
                
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Функция регистрации
    function registerUser(name, email, password) {
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        
        // Проверяем, не занят ли email
        if (users.find(u => u.email === email)) {
            return { success: false, error: 'Пользователь с таким email уже существует' };
        }
        
        // Добавляем нового пользователя
        const newUser = { 
            id: Date.now(), 
            fullName: name, 
            email: email, 
            password: password 
        };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        
        // Автоматически входим
        const currentUser = { id: newUser.id, fullName: name, email: email };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        
        return { success: true };
    }
    
    // Обработка формы регистрации
    document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        
        // Валидация
        if (!name || !email || password.length < 4) {
            document.getElementById('regError').innerText = 'Заполните все поля (пароль мин. 4 символа)';
            return;
        }
        
        const result = registerUser(name, email, password);
        
        if (result.success) {
            // Успешная регистрация - переходим на главную
            window.location.href = 'index.html';
        } else {
            document.getElementById('regError').innerText = result.error;
        }
    });
</script>

</body>
</html>
