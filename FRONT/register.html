<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация | Repair Crew Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="register-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card register-card">
                    <div class="register-header">
                        <i class="fas fa-hard-hat fa-3x mb-3"></i>
                        <h2 class="mb-0">Repair Crew Lab</h2>
                        <p class="mb-0 mt-2">Создайте новый аккаунт</p>
                    </div>
                    <div class="register-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label">Полное имя</label>
                                <input type="text" class="form-control" id="regName" placeholder="Иван Строителев" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="regEmail" placeholder="student@repaircrew.ru" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="regPassword" placeholder="минимум 4 символа" required>
                            </div>
                            <div id="regError" class="text-danger small mb-3"></div>
                            <button type="submit" class="btn btn-success w-100 py-2">
                                <i class="fas fa-user-plus me-2"></i>Создать аккаунт
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-0">Уже есть аккаунт?
                                <a href="login.html" class="text-warning">Войти</a>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left me-2"></i>Вернуться на главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const errorDiv = document.getElementById('regError');

    if (password.length < 4) {
        errorDiv.textContent = 'Пароль должен быть минимум 4 символа';
        return;
    }

    const result = await apiRequest('/api/register', 'POST', { fullName, email, password });

    if (result.success) {
        const loginResult = await apiRequest('/api/login', 'POST', { email, password });
        if (loginResult.success && loginResult.user) {
            localStorage.setItem('currentUser', JSON.stringify(loginResult.user));
            localStorage.setItem('justLoggedIn', 'true');
            window.location.href = 'index.html';
        } else {
            window.location.href = 'login.html';
        }
    } else {
        errorDiv.textContent = result.message || 'Ошибка регистрации';
    }
});
</script>
</body>
</html>
