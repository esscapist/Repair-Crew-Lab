<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | Repair Crew Lab</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* Дополнительные стили только для страницы входа */
        .login-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2c3b 0%, #1b4a5f 100%);
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        .login-card {
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: none;
            overflow: hidden;
        }
        .login-header {
            background: #0b2b3b;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 40px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }
        .back-link:hover {
            color: #FFB347;
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Карточка входа -->
                <div class="card login-card">
                    <div class="login-header">
                        <i class="fas fa-hard-hat fa-3x mb-3"></i>
                        <h2 class="mb-0">Repair Crew Lab</h2>
                        <p class="mb-0 mt-2">Войдите в свой аккаунт</p>
                    </div>
                    <div class="login-body">
                        
                        <!-- Форма входа -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="loginEmail" placeholder="student@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="loginPassword" placeholder="••••••" required>
                            </div>
                            <div id="loginError" class="text-danger small mb-3"></div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="fas fa-sign-in-alt me-2"></i>Войти
                            </button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-0">Нет аккаунта? 
                                <a href="register.html" class="text-warning">Зарегистрироваться</a>
                            </p>
                        </div>
                    </div>
                </div>
                
                <!-- Ссылка назад на главную -->
                <div class="text-center mt-4">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left me-2"></i>Вернуться на главную
                    </a>
                </div>
                
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Функции для работы с пользователями
    function loginUser(email, password) {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);
        if (user) {
            const currentUser = { id: user.id, fullName: user.fullName, email: user.email };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            return true;
        }
        return false;
    }
    
    // Обработка формы входа
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        
        if (loginUser(email, password)) {
            // Успешный вход - переходим на главную
            window.location.href = 'index.html';
        } else {
            document.getElementById('loginError').innerText = 'Неверный email или пароль';
        }
    });
</script>

</body>
</html>
